# Builds the app and runs DiPoTests on every PR and on main.
#
# CLAUDE.md's "never boot the iOS Simulator" is about working sessions on
# Fahmi's Mac; a throwaway CI runner booting one is the point of this job.
#
# The repo is public, so macOS minutes are free. Signing is off: nothing here
# is installed on a device.
name: iOS

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The app targets iOS 26.2, so the newest Xcode 26 on the image.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('DiPo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Pick a simulator
        id: sim
        run: echo "udid=$(xcrun simctl list devices available -j | python3 ci/pick-simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project DiPo.xcodeproj -scheme DiPo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath DiPo.xcresult \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log \
            | { grep -E '^(Test Suite|Test Case .*(passed|failed))|error:|\*\* (BUILD|TEST)' || true; }
          # pipefail makes the step fail with xcodebuild's status; the grep
          # group always succeeds, so it can't mask or cause a failure.

      # The grep above keeps the step log readable; the failures in full.
      - name: Summarise failures
        if: failure()
        run: |
          grep -E 'error:|failed|BEGIN SchemaFingerprint|END SchemaFingerprint' xcodebuild.log | head -200 || true
          sed -n '/BEGIN SchemaFingerprint.txt/,/END SchemaFingerprint.txt/p' xcodebuild.log | head -400 || true

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-results
          path: |
            DiPo.xcresult
            xcodebuild.log
          retention-days: 7

  # Could DiPo run on older iPhones? The app targets iOS 26.2, which needs an
  # iPhone 11 or newer, fully updated. iOS 17 also runs on the XS and XR,
  # common second-hand phones, and covers phones that are behind on updates.
  # This builds the app with the minimum overridden on the command line (the
  # project file is not changed), so the compiler lists every API that needs a
  # newer iOS. Informational: it never fails the PR.
  min-ios-probe:
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        min_ios: ["17.0", "18.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('DiPo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Build with IPHONEOS_DEPLOYMENT_TARGET=${{ matrix.min_ios }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project DiPo.xcodeproj -scheme DiPo \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=${{ matrix.min_ios }} \
            2>&1 | tee build.log | { grep -E 'error:|\*\* BUILD' || true; }
      - name: APIs that need a newer iOS
        if: always()
        run: |
          grep -E "error: .*(is only available in iOS|available in iOS [0-9]+|@available)" build.log \
            | sed -E 's#^/Users/runner/work/dipo/dipo/##' | sort -u | head -150 || true
          echo "Total errors: $(grep -c 'error:' build.log || true)"
