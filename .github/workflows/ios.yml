# Builds the app and runs DiPoTests on every PR and on main.
#
# CLAUDE.md's "never boot the iOS Simulator" is about working sessions on
# Fahmi's Mac; a throwaway CI runner booting one is the point of this job.
#
# The repo is public, so macOS minutes are free. Signing is off: nothing here
# is installed on a device.
name: iOS

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Xcode 27 has its own runner image (macOS 27, Apple silicon).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The same Xcode release.yml ships with. iPhone Duo gives an app its
      # whole inner display only when it was built with Xcode 27.1 (the iOS
      # 27.1 SDK); a build from an older Xcode is shown there letterboxed.
      # The app still targets iOS 26.2. Pinned to 27.1, never a beta.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27.1 on this image. Installed:"; ls -d /Applications/Xcode_*.app; exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('DiPo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Pick a simulator
        id: sim
        # Fails here, by name, when no simulator is found, rather than as an
        # empty destination in the next step.
        run: |
          udid=$(xcrun simctl list devices available -j | python3 ci/pick-simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project DiPo.xcodeproj -scheme DiPo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath DiPo.xcresult \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log \
            | { grep -E '^(Test Suite|Test Case .*(passed|failed))|error:|\*\* (BUILD|TEST)|PERF\|' || true; }
          # pipefail makes the step fail with xcodebuild's status; the grep
          # group always succeeds, so it can't mask or cause a failure.

      # release.yml sends each build's dSYMs to Crashlytics with this tool,
      # from the same package checkout. Releases can't run on a PR, so the
      # tool's place and flags are checked here, where a package update that
      # moves or changes it shows up first. Nothing is uploaded.
      - name: Crashlytics upload tool
        run: |
          tool=.spm/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols
          test -x "$tool" || { echo "::error::$tool is missing; release.yml can't send dSYMs to Crashlytics"; exit 1; }
          # Run bare, it only says no plist was given; --help lists the flags.
          usage=$("$tool" --help 2>&1 || true)
          for flag in -gsp -p; do
            printf '%s' "$usage" | grep -qE -- "(^|[^A-Za-z-])$flag([^A-Za-z-]|$)" \
              || { echo "::error::upload-symbols no longer lists $flag; update release.yml"; printf '%s\n' "$usage" | head -40; exit 1; }
          done
          echo "upload-symbols found and takes -gsp and -p:"
          printf '%s\n' "$usage" | head -20

      # The grep above keeps the step log readable; the failures in full.
      - name: Summarise failures
        if: failure()
        run: |
          grep -E 'error:|failed|BEGIN SchemaFingerprint|END SchemaFingerprint' xcodebuild.log | head -200 || true
          sed -n '/BEGIN SchemaFingerprint.txt/,/END SchemaFingerprint.txt/p' xcodebuild.log | head -400 || true
          # A run that stops with no failed test (a crash, a lost simulator)
          # gives its reason in the indented lines under "Testing failed:",
          # and xcodebuild says where it restarted after a crash.
          sed -n '/^Testing failed:/,/^\*\* TEST/p' xcodebuild.log | head -40 || true
          grep -E 'Restarting after|crashed|Lost connection|timed out' xcodebuild.log | head -20 || true

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcode-results
          path: |
            DiPo.xcresult
            xcodebuild.log
          retention-days: 7

  # The SDKs end to end: FirebaseEmulatorTests sends real requests through the
  # Firebase Auth and Firestore SDKs, to the Firebase Local Emulator Suite
  # running on this runner. The project is demo-dipo, which the emulators keep
  # local: no real Firebase project, data or credentials are involved. No
  # rules file is loaded, so the emulator allows every read and write; the
  # production rules are tested in dipo-backend. firebase-tools is pinned to
  # the version dipo-backend uses.
  sdk-emulator:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27.1 on this image. Installed:"; ls -d /Applications/Xcode_*.app; exit 1
          fi
          sudo xcode-select -s "$XCODE"

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('DiPo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # The emulators are a Node tool that runs Firestore on Java.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the emulators
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-14.27.0

      - name: Start the Firebase emulators
        run: |
          npx --yes firebase-tools@14.27.0 emulators:start --only auth,firestore \
            --project demo-dipo --config ci/firebase-emulator.json > emulators.log 2>&1 &
          # Up when both answer; the first run also downloads the Firestore emulator.
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:9099 && curl -s -o /dev/null http://127.0.0.1:8080; then
              echo "Emulators up after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::The Firebase emulators did not start"; cat emulators.log; exit 1

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 ci/pick-simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Signed to run locally ("-", no certificate or profile), not unsigned
      # as in build-and-test: Firebase Auth keeps the signed-in user in the
      # keychain, and an unsigned app has no keychain entitlement (SecItemAdd
      # -34018), so every sign-in failed.
      - name: Run the emulator tests
        env:
          # xcodebuild hands TEST_RUNNER_-prefixed variables to the tests,
          # without the prefix. Unset, FirebaseEmulatorTests skips.
          TEST_RUNNER_DIPO_AUTH_EMULATOR: 127.0.0.1:9099
          TEST_RUNNER_DIPO_FIRESTORE_EMULATOR: 127.0.0.1:8080
        run: |
          set -o pipefail
          xcodebuild test \
            -project DiPo.xcodeproj -scheme DiPo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:DiPoTests/FirebaseEmulatorTests \
            -clonedSourcePackagesDirPath .spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee xcodebuild.log \
            | { grep -E '^(Test Suite|Test Case .*(passed|failed|skipped))|error:|\*\* (BUILD|TEST)' || true; }
          # A skip here means the tests could not see the emulator: fail.
          if grep -qE "Test Case .*FirebaseEmulatorTests.*skipped" xcodebuild.log; then
            echo "::error::FirebaseEmulatorTests skipped: the emulator variables did not reach the tests"; exit 1
          fi
          grep -qE "Test Case .*FirebaseEmulatorTests.*passed" xcodebuild.log \
            || { echo "::error::No FirebaseEmulatorTests ran"; exit 1; }

      - name: Emulator log
        if: failure()
        run: tail -100 emulators.log || true

  # Could DiPo run on older iPhones? The app targets iOS 26.2, which needs an
  # iPhone 11 or newer, fully updated. iOS 17 also runs on the XS and XR,
  # common second-hand phones, and covers phones that are behind on updates.
  # This builds the app with the minimum overridden on the command line (the
  # project file is not changed), so the compiler lists every API that needs a
  # newer iOS. Informational: it never fails the PR.
  min-ios-probe:
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        min_ios: ["17.0", "18.0"]
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('DiPo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Build with IPHONEOS_DEPLOYMENT_TARGET=${{ matrix.min_ios }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project DiPo.xcodeproj -scheme DiPo \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=${{ matrix.min_ios }} \
            2>&1 | tee build.log | { grep -E 'error:|\*\* BUILD' || true; }
      - name: APIs that need a newer iOS
        if: always()
        run: |
          grep -E "error: .*(is only available in iOS|available in iOS [0-9]+|@available)" build.log \
            | sed -E 's#^/Users/runner/work/dipo/dipo/##' | sort -u | head -150 || true
          echo "Total errors: $(grep -c 'error:' build.log || true)"

  # TEMPORARY: comes out before merge. Which part of `xcodebuild test` talks
  # to the simulator's instruments service hub (DTServiceHub, reached as
  # "com.apple.instruments.deviceservice.lockdown")? Twice this week that
  # connection failed and the run later stopped with no test failing. Each
  # leg builds once, runs the two classes those runs stopped in with one
  # setting changed, and records every DTServiceHub the simulator starts.
  lockdown-probe:
    runs-on: xcode-27
    timeout-minutes: 50
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        variant: [as-today, collect-test-diagnostics-never, screen-capture-off]
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$XCODE" ] || { ls -d /Applications/Xcode_*.app; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # Restore only: the probe never writes the shared package cache.
      - name: Restore Swift packages
        uses: actions/cache/restore@v5
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('DiPo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 ci/pick-simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"

      - name: Test options this xcodebuild has
        run: |
          xcodebuild -help 2>&1 | grep -iE -A3 'diagnos|screen|captur|record|attachment|video' || echo "(none matched)"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project DiPo.xcodeproj -scheme DiPo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath dd -clonedSourcePackagesDirPath .spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | { grep -E 'error:|\*\* BUILD' || true; }

      - name: Set up the variant
        id: variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          xctestrun=$(ls dd/Build/Products/*.xctestrun | head -1)
          echo "xctestrun=$xctestrun" >> "$GITHUB_OUTPUT"
          # Every test target's settings as build-for-testing wrote them,
          # paths and environment left out; screen-capture-off then turns off
          # automatic screen capture the way a test plan's "Off" does.
          python3 - "$xctestrun" "$VARIANT" <<'PY'
          import plistlib, sys
          path, variant = sys.argv[1], sys.argv[2]
          with open(path, "rb") as f:
              plist = plistlib.load(f)
          print("FormatVersion:", plist.get("__xctestrun_metadata__", {}).get("FormatVersion"))
          targets = []
          def walk(x):
              if isinstance(x, dict):
                  if "TestBundlePath" in x:
                      targets.append(x)
                  for v in x.values():
                      walk(v)
              elif isinstance(x, list):
                  for v in x:
                      walk(v)
          walk(plist)
          for t in targets:
              print("--", t.get("BlueprintName"))
              for k in sorted(t):
                  if "Path" in k or "Environment" in k or k.startswith("Dependent"):
                      continue
                  print(f"   {k} = {t[k]!r}"[:200])
          if variant == "screen-capture-off":
              for t in targets:
                  t["SystemAttachmentLifetime"] = "keepNever"
              with open(path, "wb") as f:
                  plistlib.dump(plist, f)
              print(f"SystemAttachmentLifetime = keepNever on {len(targets)} test target(s)")
          PY

      - name: Run two classes, watching the service hub
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          VARIANT: ${{ matrix.variant }}
          XCTESTRUN: ${{ steps.variant.outputs.xctestrun }}
        run: |
          extra=()
          [ "$VARIANT" = collect-test-diagnostics-never ] && extra=(-collect-test-diagnostics never)
          # Every process whose name has "servicehub" in it, sampled each second.
          ( while :; do
              ps -axo pid=,ppid=,lstart=,command= | grep -i '[s]ervicehub' | sed "s|^|$(date -u +%H:%M:%S) |"
              sleep 1
            done ) > hub-ps.log 2>&1 &
          sampler=$!
          echo "xcodebuild starts $(date -u +%H:%M:%S) with: ${extra[*]:-(nothing extra)}"
          set +e
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "id=$UDID" \
            -only-testing:DiPoTests/PerformanceTests -only-testing:DiPoTests/StoreMigrationTests \
            -resultBundlePath probe.xcresult "${extra[@]}" \
            2>&1 | tee xcodebuild.log \
            | grep --line-buffered -iE "^(Test Suite|Test Case .*(passed|failed))|error:|\*\* TEST|lockdown|servicehub"
          status=${PIPESTATUS[0]}
          kill $sampler
          echo "xcodebuild ends $(date -u +%H:%M:%S), exit $status"
          echo "Test Case lines passed: $(grep -cE "^Test Case .*passed" xcodebuild.log)"
          echo "::group::DTServiceHub processes seen (first sighting of each pid)"
          awk '!seen[$2]++' hub-ps.log | cut -c1-400
          echo "::endgroup::"
          echo "::group::xcodebuild.log: service hub, recording, diagnostics"
          grep -iE 'lockdown|servicehub|record|screen|diagnos|spindump|sysdiagnose' xcodebuild.log | cut -c1-400 | head -60 || true
          echo "::endgroup::"
          echo "::group::Simulator log: service hub"
          xcrun simctl spawn "$UDID" log show --last 60m --style compact \
            --predicate 'process CONTAINS[c] "servicehub" OR eventMessage CONTAINS[c] "servicehub" OR eventMessage CONTAINS[c] "deviceservice"' \
            2>&1 | cut -c1-400 | head -200 || true
          echo "::endgroup::"
          echo "::group::Mac log: service hub"
          log show --last 60m --style compact \
            --predicate 'eventMessage CONTAINS[c] "servicehub" OR eventMessage CONTAINS[c] "deviceservice.lockdown"' \
            2>&1 | cut -c1-400 | head -200 || true
          echo "::endgroup::"
          exit $status
